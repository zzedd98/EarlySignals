services:
  postgres:
    image: postgres:16-alpine
    container_name: earlysignals-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-earlysignals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-earlysignals_dev}
      POSTGRES_DB: ${POSTGRES_DB:-earlysignals}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-earlysignals}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - earlysignals-network

  redis:
    image: redis:7-alpine
    container_name: earlysignals-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - earlysignals-network

  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: earlysignals-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_dev_change_in_prod}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - earlysignals-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: earlysignals-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - earlysignals-network

